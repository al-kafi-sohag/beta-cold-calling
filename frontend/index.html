<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<title>Bengali Cold-Call Agent — Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
<style>
  @keyframes pulse-ring { 0% { transform: scale(0.9); opacity: 0.6; } 70% { transform: scale(1.4); opacity: 0; } 100% { transform: scale(1.4); opacity: 0; } }
  .pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }
  @keyframes bar-bounce { 0%, 100% { height: 6px; } 50% { height: 28px; } }
  .bar { animation: bar-bounce 0.9s ease-in-out infinite; }
  .bar:nth-child(2) { animation-delay: 0.1s; }
  .bar:nth-child(3) { animation-delay: 0.2s; }
  .bar:nth-child(4) { animation-delay: 0.3s; }
  .bar:nth-child(5) { animation-delay: 0.15s; }
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .log-line { font-family: ui-monospace, monospace; }
</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

<nav class="border-b border-slate-800 bg-slate-900/60">
  <div class="max-w-4xl mx-auto px-6 py-3 flex items-center gap-6">
    <span class="font-semibold">📞 Cold-Call Agent</span>
    <a href="/" class="text-sm text-emerald-400 font-medium">Demo Call</a>
    <a href="/dashboard" class="text-sm text-slate-400 hover:text-slate-200">Dashboard</a>
    <a href="/kb" class="text-sm text-slate-400 hover:text-slate-200">Knowledge Base</a>
  </div>
</nav>

<div class="max-w-4xl mx-auto p-6">
  <h1 class="text-2xl font-semibold mb-1">Browser-Mic Demo</h1>
  <p class="text-slate-400 mb-6 text-sm">Auto voice detection: agent speaks → mic opens automatically → stops when you stop talking.</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div>
      <label class="text-xs text-slate-400">Phone</label>
      <select id="leadSelect" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm"></select>
    </div>
    <div class="col-span-2 flex items-end gap-3">
      <button id="startBtn" class="bg-emerald-600 hover:bg-emerald-500 transition rounded-lg px-5 py-2 text-sm font-medium">
        ▶ Start Call
      </button>
      <div id="statusPill" class="px-3 py-2 rounded-lg text-xs bg-slate-800 border border-slate-700">
        status: <span id="statusText" class="font-semibold">idle</span>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center min-h-[220px] relative">
      <div id="ringWrap" class="absolute w-24 h-24 rounded-full bg-emerald-500/30 pulse-ring hidden"></div>
      <div id="micCircle" class="w-20 h-20 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center z-10 transition-colors">
        <span id="micIcon" class="text-2xl">🎙️</span>
      </div>
      <div id="bars" class="hidden flex items-end gap-1 h-8 mt-4">
        <div class="bar w-1.5 bg-emerald-400 rounded"></div>
        <div class="bar w-1.5 bg-emerald-400 rounded"></div>
        <div class="bar w-1.5 bg-emerald-400 rounded"></div>
        <div class="bar w-1.5 bg-emerald-400 rounded"></div>
        <div class="bar w-1.5 bg-emerald-400 rounded"></div>
      </div>
      <p id="phaseLabel" class="text-sm text-slate-400 mt-4">Waiting to start...</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 h-[220px] overflow-y-auto" id="conversation">
      <p class="text-slate-500 text-sm">Conversation will appear here...</p>
    </div>
  </div>

  <div class="mt-6 bg-black border border-slate-800 rounded-2xl p-4 h-64 overflow-y-auto" id="logBox">
    <p class="text-slate-600 text-xs log-line">Logs will appear here...</p>
  </div>
</div>

<script>
// Relative base — works no matter what host/port/tunnel this page is served from.
const API = "";
let currentPhone = null;
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
let audioContext = null;
let analyser = null;
let vadRafId = null;
let hasSpeechStarted = false;
let silenceStart = null;
let recordingActive = false;

const SILENCE_THRESHOLD = 0.015;
const SILENCE_DURATION_MS = 1200;
const MIN_SPEECH_MS = 400;

function log(msg, level = "info") {
  const colors = { info: "text-slate-300", warn: "text-amber-400", error: "text-red-400", ok: "text-emerald-400" };
  const el = document.getElementById("logBox");
  const time = new Date().toLocaleTimeString();
  const line = document.createElement("div");
  line.className = `log-line text-xs ${colors[level] || colors.info} fade-in`;
  line.textContent = `[${time}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setStatus(s) { document.getElementById("statusText").textContent = s; }

function setPhase(text, { listening = false, speaking = false } = {}) {
  document.getElementById("phaseLabel").textContent = text;
  document.getElementById("ringWrap").classList.toggle("hidden", !listening);
  document.getElementById("bars").classList.toggle("hidden", !speaking);
  const circle = document.getElementById("micCircle");
  circle.classList.toggle("border-emerald-500", listening);
  circle.classList.toggle("bg-emerald-950", listening);
  circle.classList.toggle("border-sky-500", speaking);
  circle.classList.toggle("bg-sky-950", speaking);
  if (!listening && !speaking) {
    circle.className = "w-20 h-20 rounded-full bg-slate-800 border-2 border-slate-700 flex items-center justify-center z-10 transition-colors";
  }
}

function addBubble(who, text) {
  const box = document.getElementById("conversation");
  if (box.children.length === 1 && box.children[0].tagName === "P") box.innerHTML = "";
  const bubble = document.createElement("div");
  bubble.className = `mb-2 fade-in text-sm ${who === "agent" ? "text-emerald-300" : "text-sky-300"}`;
  bubble.innerHTML = `<span class="font-semibold">${who === "agent" ? "মিতা (AI)" : "Lead (you)"}:</span> ${text}`;
  box.appendChild(bubble);
  box.scrollTop = box.scrollHeight;
}

async function loadLeads() {
  log("Fetching leads from /api/leads...");
  try {
    const res = await axios.get(`${API}/api/leads`);
    const select = document.getElementById("leadSelect");
    select.innerHTML = "";
    res.data.forEach(lead => {
      const opt = document.createElement("option");
      opt.value = JSON.stringify(lead);
      opt.textContent = `${lead.name} (${lead.phone}) — ${lead.status}`;
      select.appendChild(opt);
    });
    log(`Loaded ${res.data.length} leads`, "ok");
  } catch (err) {
    log(`Failed to load leads: ${err.message}. Is the backend running (uvicorn backend.main:app --port 8000)?`, "error");
  }
}

function playBase64Audio(b64) {
  return new Promise((resolve) => {
    const audio = new Audio("data:audio/mp3;base64," + b64);
    audio.onended = resolve;
    audio.onerror = resolve;
    audio.play();
  });
}

async function startCall() {
  const raw = document.getElementById("leadSelect").value;
  if (!raw) { log("No lead selected", "warn"); return; }
  const lead = JSON.parse(raw);
  currentPhone = lead.phone;

  log(`Starting call: ${lead.name} (${lead.phone}) — course=${lead.course_key}`);
  setStatus("starting");
  setPhase("Connecting...");

  const form = new FormData();
  form.append("phone", lead.phone);
  form.append("name", lead.name);
  form.append("course_key", lead.course_key);

  try {
    const res = await axios.post(`${API}/api/call/start`, form);
    log(`Agent opened: "${res.data.agent_text}"`, "ok");
    addBubble("agent", res.data.agent_text);
    setStatus(res.data.status);

    setPhase("মিতা কথা বলছে...", { speaking: true });
    await playBase64Audio(res.data.agent_audio_base64);
    setPhase("Listening...", { listening: true });

    await startVoiceDetection();
  } catch (err) {
    log(`Start call failed: ${err.message}`, "error");
  }
}

async function startVoiceDetection() {
  if (!mediaStream) {
    log("Requesting microphone access...");
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1, sampleRate: 16000 }
    });
    log("Microphone access granted", "ok");
  }

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioContext.createMediaStreamSource(mediaStream);
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  const dataArray = new Uint8Array(analyser.fftSize);

  audioChunks = [];
  hasSpeechStarted = false;
  silenceStart = null;
  recordingActive = true;

  let mimeType = "audio/webm;codecs=opus";
  if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = "audio/webm";
  mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.start(250);
  const speechStartTime = Date.now();

  log("VAD loop started — waiting for you to speak (auto-stops after 1.2s silence)");

  function computeRMS() {
    analyser.getByteTimeDomainData(dataArray);
    let sumSquares = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const norm = (dataArray[i] - 128) / 128;
      sumSquares += norm * norm;
    }
    return Math.sqrt(sumSquares / dataArray.length);
  }

  function vadLoop() {
    if (!recordingActive) return;
    const rms = computeRMS();

    if (rms > SILENCE_THRESHOLD) {
      if (!hasSpeechStarted && Date.now() - speechStartTime > MIN_SPEECH_MS) {
        hasSpeechStarted = true;
        log("🎤 Speech detected — recording...", "ok");
      }
      silenceStart = null;
    } else if (hasSpeechStarted) {
      if (silenceStart === null) silenceStart = Date.now();
      const silentFor = Date.now() - silenceStart;
      if (silentFor > SILENCE_DURATION_MS) {
        stopVoiceDetection();
        return;
      }
    }
    vadRafId = requestAnimationFrame(vadLoop);
  }

  vadLoop();
}

function stopVoiceDetection() {
  recordingActive = false;
  cancelAnimationFrame(vadRafId);
  log("🛑 Silence detected — stopping recording");
  setPhase("Processing...", {});

  mediaRecorder.onstop = async () => {
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
    if (audioContext) { audioContext.close(); audioContext = null; }

    if (!hasSpeechStarted) {
      log("No speech was detected this turn, restarting listener", "warn");
      setPhase("Listening...", { listening: true });
      await startVoiceDetection();
      return;
    }

    await sendTurn(blob);
  };
  mediaRecorder.stop();
}

async function sendTurn(blob) {
  log(`Uploading ${(blob.size / 1024).toFixed(1)} KB audio to backend...`);
  const form = new FormData();
  form.append("phone", currentPhone);
  form.append("audio", blob, "turn.webm");

  try {
    const res = await axios.post(`${API}/api/call/turn`, form);
    const d = res.data;

    log(`STT heard: "${d.lead_text}"`, d.lead_text ? "ok" : "warn");
    log(`Timings — stt:${d.timings.stt_time_sec}s llm:${d.timings.llm_time_sec ?? "-"}s tts:${d.timings.tts_time_sec ?? "-"}s vol:${d.timings.volume_dbfs}dBFS`);
    log(`Agent reply: "${d.agent_text}" | status=${d.status}`, "ok");

    if (d.lead_text) addBubble("lead", d.lead_text);
    addBubble("agent", d.agent_text);
    setStatus(d.status);

    setPhase("মিতা কথা বলছে...", { speaking: true });
    await playBase64Audio(d.agent_audio_base64);

    if (d.call_ended) {
      log(`🏁 Call ended — final status: ${d.status}`, "ok");
      setPhase("Call ended", {});
      setStatus(`ended: ${d.status}`);
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      await loadLeads();
      return;
    }

    setPhase("Listening...", { listening: true });
    await startVoiceDetection();
  } catch (err) {
    log(`Turn failed: ${err.message}`, "error");
    setPhase("Error — retrying listener", {});
    await startVoiceDetection();
  }
}

document.getElementById("startBtn").addEventListener("click", startCall);
loadLeads();
</script>
</body>
</html>
